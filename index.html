<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سفير المنح الدراسية | دليلك للمنح والفرص التعليمية</title>

  <meta
    name="description"
    content="سفير المنح الدراسية - منصة تساعدك على اكتشاف المنح الدراسية والفرص التعليمية والجامعات."
  >

  <style>
    :root {
      --primary: #0b3555;
      --primary-2: #146aa2;
      --gold: #f4c64e;
      --gold-dark: #d9a72f;
      --bg: #f5f8fc;
      --card: #ffffff;
      --text: #142333;
      --muted: #697586;
      --border: #e4eaf0;
      --success: #16824d;
      --success-bg: #e8f7ef;
      --warning: #a96b00;
      --warning-bg: #fff4d8;
      --danger: #b42318;
      --danger-bg: #fdecec;
      --shadow: 0 12px 35px rgba(11, 53, 85, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(244,198,78,.15), transparent 20%),
        linear-gradient(135deg, #082b47 0%, #0d4d79 55%, #126ca4 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    .navbar {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255,255,255,.92);
      font-size: 14px;
      transition: .2s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .hero {
      padding: 62px 0 85px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 13px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.15;
      max-width: 900px;
      margin: auto;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      max-width: 760px;
      margin: 18px auto 30px;
      color: rgba(255,255,255,.80);
      font-size: 17px;
    }

    .search-box {
      max-width: 850px;
      margin: auto;
      background: #fff;
      border-radius: 18px;
      padding: 9px;
      display: flex;
      gap: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      padding: 15px 16px;
      font-size: 16px;
      background: transparent;
    }

    .search-btn {
      border: 0;
      cursor: pointer;
      background: var(--gold);
      color: #142333;
      font-weight: 900;
      border-radius: 12px;
      padding: 0 24px;
      transition: .2s;
    }

    .search-btn:hover {
      background: #ffd66b;
      transform: translateY(-1px);
    }

    /* =========================
       QUICK STATS
    ========================== */

    .stats-wrap {
      margin-top: -38px;
      position: relative;
      z-index: 2;
    }

    .stats {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      overflow: hidden;
    }

    .stat {
      padding: 22px 15px;
      text-align: center;
      border-left: 1px solid var(--border);
    }

    .stat:last-child {
      border-left: 0;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: var(--primary);
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MAIN
    ========================== */

    main {
      padding: 55px 0 80px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: end;
      margin-bottom: 24px;
    }

    .section-head h2 {
      font-size: 28px;
      color: var(--primary);
    }

    .section-head p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    /* =========================
       FILTERS
    ========================== */

    .filters {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 35px;
      box-shadow: var(--shadow);
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 700;
    }
